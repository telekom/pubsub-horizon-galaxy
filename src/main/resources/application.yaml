spring:
  application:
    name: Horizon Galaxy

logging:
  level:
    root: ${LOG_LEVEL:INFO}

horizon:
  kafka:
    bootstrapServers: ${GALAXY_KAFKA_BROKERS:kafka:9092}
    transactionIdPrefix: ${GALAXY_KAFKA_TRANSACTION_PREFIX:multiplexer}
    groupId: ${GALAXY_KAFKA_GROUP_ID:multiplexers}
    staticMembership: true
    sessionTimeoutMs: ${GALAXY_KAFKA_SESSION_TIMEOUT:90000}
    groupInstanceId: ${GALAXY_KAFKA_GROUP_INSTANCE_ID:multiplexer-0}
    consumingTopic: ${GALAXY_KAFKA_CONSUMING_TOPIC:published}
    partitionCount: ${GALAXY_KAFKA_PARTITION_COUNT:10}
    transactionTimeout: ${GALAXY_KAFKA_TRANSACTION_TIMEOUT:1000}
    autoCreateTopics: ${GALAXY_KAFKA_AUTO_CREATE_TOPICS:false}
    autoResetOffset: ${GALAXY_KAFKA_AUTO_OFFSET_RESET:earliest}
    autoCommit: ${GALAXY_KAFKA_AUTO_COMMIT:false}
    lingerMs: ${GALAXY_KAFKA_LINGER_MS:0}
    acks: ${GALAXY_KAFKA_ACKS:1}
    maxRequestSize: ${GALAXY_KAFKA_MAXREQUESTSIZE:1101004}
    fatalExceptionHandlingEnabled: ${GALAXY_KAFKA_FATAL_EXCEPTION_HANDLING_ENABLED:true}
    compression:
      enabled: ${GALAXY_KAFKA_COMPRESSION_ENABLED:false}
      type: ${GALAXY_KAFKA_COMPRESSION_TYPE:none}
  cache:
    enabled: true
    local-subscription-cache:
      enabled: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_ENABLED:true}
      fallback-mode: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_FALLBACK_MODE:hazelcast-with-mongo-fallback}
      snapshot-collection: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_SNAPSHOT_COLLECTION:subscriptions.subscriber.horizon.telekom.de.v1-snapshots}
      head-collection: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_HEAD_COLLECTION:subscriptions.subscriber.horizon.telekom.de.v1-head}
      stale-local-cache-read-grace-period: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_STALE_LOCAL_CACHE_READ_GRACE_PERIOD:120s}
      require-local-cache-at-startup: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_REQUIRE_LOCAL_CACHE_AT_STARTUP:false}
      initial-snapshot-timeout: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_INITIAL_SNAPSHOT_TIMEOUT:120s}
      mongo-head-fallback-enabled: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_MONGO_HEAD_FALLBACK_ENABLED:true}
      mongo-head-poll-jitter: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_MONGO_HEAD_POLL_JITTER:10s}
      mongo-snapshot-sync-jitter: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_MONGO_SNAPSHOT_SYNC_JITTER:10s}
      reconcile-interval: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_RECONCILE_INTERVAL:60s}
      zoo-keeper:
        enabled: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_ENABLED:true}
        ensemble-tracker-enabled: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_ENSEMBLE_TRACKER_ENABLED:true}
        connect-string: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_CONNECT_STRING:horizon-zookeeper.integration.svc.cluster.local:2181}
        prepared-path: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_PREPARED_PATH:/horizon/subscriptions/prepared}
        activate-path: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_ACTIVATE_PATH:/horizon/subscriptions/activated}
        connection-timeout: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_CONNECTION_TIMEOUT:5s}
        session-timeout: ${GALAXY_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_SESSION_TIMEOUT:30s}
    kubernetesServiceDns: ${GALAXY_CACHE_SERVICE_DNS:horizon-quasar-discovery-headless.integration.svc.cluster.local}
    deDuplication:
      enabled: ${GALAXY_CACHE_DE_DUPLICATION_ENABLED:false}
      defaultCacheName: galaxy-deduplication
  mongo:
    enabled: ${GALAXY_MONGO_ENABLED:true}
    url: ${GALAXY_MONGO_URL:mongodb://root:root@localhost:27017}
    databases:
      configTimeDatabase: ${GALAXY_MONGO_CONFIG_DATABASE:horizon-config}
    collection: ${GALAXY_MONGO_COLLECTION:eventSubscriptions}

pandora:
  tracing:
    name: horizon

galaxy:
  batch-core-threadpool-size: ${GALAXY_CORE_THREADPOOL_SIZE:40}
  batch-max-threadpool-size: ${GALAXY_MAX_THREADPOOL_SIZE:40}
  batch-queue-capacity: ${GALAXY_BATCH_QUEUE_CAPACITY:1400}
  subscription-core-threadpool-size: ${GALAXY_SUBSCRIPTION_CORE_THREADPOOL_SIZE:50}
  subscription-max-threadpool-size: ${GALAXY_SUBSCRIPTION_MAX_THREADPOOL_SIZE:50}
  subscription-queue-capacity: ${GALAXY_SUBSCRIPTION_QUEUE_CAPACITY:15000}
  nack-sleep-duration-ms: ${GALAXY_NACK_SLEEP_DURATION_MS:5000}
  backpressure-resume-check-interval-ms: 5000
  backpressure-resume-threshold: ${GALAXY_BACKPRESSURE_RESUME_THRESHOLD:0.5}
  default-environment: ${GALAXY_DEFAULT_ENVIRONMENT:default}
  feature-jsonpath-filtering-enabled: ${GALAXY_FEATURE_JSONPATH_FILTERING_ENABLED:false}
  feature-jsonpath-filtering-event-types: ${GALAXY_FEATURE_JSONPATH_FILTERING_EVENT_TYPES:}
management:
  metrics:
    distribution:
      percentiles-histogram:
        spring.kafka.listener.*: true
      maximum-expected-value:
        spring.kafka.listener.*: 60000
      minimum-expected-value:
        spring.kafka.listener.*: 1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    hazelcast:
      enabled: false
    mongo:
      enabled: false
  zipkin:
    tracing:
      endpoint: ${JAEGER_COLLECTOR_URL:http://jaeger-collector.example.com:9411}
  tracing:
    sampling:
      probability: ${ZIPKIN_SAMPLER_PROBABILITY:1.0}
